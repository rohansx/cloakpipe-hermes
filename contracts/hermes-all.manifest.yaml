# Generated by tools/gen_contract.py from contracts/hermes-tools.json: every Hermes
# built-in tool, arguments closed to its schema. Tools with hand-written rules
# (side effects, approvals) are copied from contracts/hermes.manifest.yaml.
release: hermes
version: "0.1-all"
policy: hermes-all.cedar
tools:
  annotate_preview: {}
  browser_cdp: {}
  browser_dialog: {}
  browser_exec: {}
  browser_vault: {}
  clarify: {}
  close_terminal: {}
  computer_use: {}
  cronjob_manage: {}
  delegate_task: {}
  desktop_preview: {}
  desktop_project: {}
  discord: {}
  discord_admin: {}
  drive_preview: {}
  execute_code:
    args:
      code: { type: string, required: true }
      reset: { type: boolean }
    effect: write
    # Arbitrary code: a human taps approve on this exact script.
    approval:
      approvers: ["hermes:owner"]
      ttl: 15m
  feishu_doc_read: {}
  feishu_drive_add_comment: {}
  feishu_drive_list_comment_replies: {}
  feishu_drive_list_comments: {}
  feishu_drive_reply_comment: {}
  focus_pane: {}
  gui_tour: {}
  image_generate: {}
  kanban_attach: {}
  kanban_attach_url: {}
  kanban_attachments: {}
  kanban_block: {}
  kanban_comment: {}
  kanban_complete: {}
  kanban_create: {}
  kanban_heartbeat: {}
  kanban_link: {}
  kanban_list: {}
  kanban_request_changes: {}
  kanban_request_review: {}
  kanban_schedule: {}
  kanban_show: {}
  kanban_unblock: {}
  manage_catalog:
    args:
      items: {"type": "array", "items": {"type": "object"}}
  manage_connections: {}
  memory: {}
  patch:
    args:
      path: { type: string, min_len: 1, max_len: 1000, required: true }
      old_string: { type: string, required: true }
      new_string: { type: string, required: true }
      replace_all: { type: boolean }
    effect: write
    idempotency_key: "{path}:{sha256(old_string)}:{sha256(new_string)}"
  process_manage:
    args:
      action: { type: string, enum: [list, poll, log, wait, kill, write, submit, close, handoff], required: true }
      session_id: { type: string, max_len: 200 }
      data: { type: string, max_len: 8000 }
      timeout: { type: integer, min: 0 }
      offset: { type: integer, min: 0 }
      limit: { type: integer, min: 0 }
  react_to_message: {}
  read_file:
    args:
      path: { type: string, min_len: 1, max_len: 1000, required: true }
      offset: { type: integer, min: 1 }
      limit: { type: integer, min: 1, max: 2000 }
  read_terminal: {}
  read_window_below: {}
  search_files: {}
  session_search: {}
  set_theme: {}
  setup_beat: {}
  show_tip: {}
  skill_manage: {}
  skill_view: {}
  skills_list: {}
  terminal:
    args:
      command: { type: string, min_len: 1, max_len: 8000, required: true }
      background: { type: boolean }
      pty: { type: boolean }
      timeout: { type: integer, min: 0 }
      workdir: { type: string, max_len: 1000 }
      notify: { type: boolean }
      heartbeat: { type: integer, min: 0 }
      persist_on_release: { type: boolean }
  text_to_speech: {}
  todo_list: {}
  video_analyze: {}
  video_generate: {}
  vision_analyze: {}
  web_extract: {}
  web_search: {}
  write_file:
    args:
      path: { type: string, min_len: 1, max_len: 1000, required: true }
      content: { type: string, required: true }
    effect: write
    idempotency_key: "{path}:{sha256(content)}"
  x_search: {}
  xai_video_edit: {}
  xai_video_extend: {}
  yb_query_group_info: {}
  yb_query_group_members: {}
  yb_search_sticker: {}
  yb_send_dm: {}
  yb_send_sticker: {}
